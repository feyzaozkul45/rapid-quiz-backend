    answer: 3
  - text: "HTTP 500 durum kodu ne anlama gelir?"
    difficulty: 2
    choices: ["Yönlendirme", "Sunucu tarafında hata", "Geçersiz istek", "İçerik yok"]
    answer: 2
  - text: "JSON kısaltması neyin açılımıdır?"
    difficulty: 1
    choices: ["Java Standard Object Network", "JavaScript Object Notation", "Joint Script Online Node", "Java Syntax Open Naming"]

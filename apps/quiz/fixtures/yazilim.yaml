name: Yazılım
slug: yazilim
description: Programlama, web teknolojileri ve yazılım geliştirme pratikleri
icon: code
order: 5
questions:
  - text: "HTML kısaltması neyin açılımıdır?"
    difficulty: 1
    choices: ["HyperText Markup Language", "High Tech Modern Language", "Hyper Transfer Mail Link", "Home Tool Markup Language"]
    answer: 1
  - text: "Web sayfalarını biçimlendirmek ve görünümünü düzenlemek için hangi dil kullanılır?"
    difficulty: 1
    choices: ["SQL", "CSS", "Bash", "YAML"]
    answer: 2
  - text: "Python'da aşağıdakilerden hangisi bir liste tanımıdır?"
    difficulty: 1
    choices: ["(1, 2, 3)", "{1, 2, 3}", "[1, 2, 3]", "<1, 2, 3>"]
    answer: 3
  - text: "Aşağıdakilerden hangisi bir sürüm kontrol sistemidir?"
    difficulty: 1
    choices: ["Docker", "Nginx", "Redis", "Git"]
    answer: 4
  - text: "Bir fonksiyonun kendi kendini çağırmasına ne ad verilir?"

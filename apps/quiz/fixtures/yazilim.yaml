  - text: "Bir uygulamayı bağımlılıklarıyla birlikte paketleyip yalıtılmış çalıştıran birime ne ad verilir?"
    difficulty: 2
    choices: ["Konteyner", "Derleyici", "Yönlendirici", "Önbellek"]
    answer: 1
  - text: "HTTPS kısaltmasındaki \"S\" harfi neyi ifade eder?"
    difficulty: 2
    choices: ["Server", "Secure", "Standard", "Simple"]

name: Yapay Zeka
slug: yapay-zeka
description: Makine öğrenmesi, sinir ağları ve yapay zekanın temelleri
icon: brain
order: 1
questions:
  - text: "Transformer mimarisini tanıtan makale hangisidir?"
    difficulty: 2
    choices: ["Attention Is All You Need", "Deep Residual Learning for Image Recognition", "Generative Adversarial Nets", "ImageNet Classification with Deep Convolutional Neural Networks"]
    answer: 1
  - text: "\"Yapay zeka\" terimini 1956 Dartmouth çalıştayı için ilk kez öneren kişi kimdir?"
    difficulty: 2
    choices: ["Alan Turing", "Geoffrey Hinton", "John McCarthy", "Yann LeCun"]
    answer: 3
  - text: "Bir makinenin zeki davranıp davranmadığını sınayan ünlü testi kim önermiştir?"
    difficulty: 1
    choices: ["John von Neumann", "Alan Turing", "Ada Lovelace", "Claude Shannon"]
    answer: 2
  - text: "ChatGPT'yi geliştiren şirket hangisidir?"
    difficulty: 1
    choices: ["OpenAI", "Intel", "Oracle", "Adobe"]
    answer: 1
  - text: "Etiketli veriyle, yani doğru cevapları bilinen örneklerle model eğitmeye ne ad verilir?"
    difficulty: 1
    choices: ["Denetimsiz öğrenme", "Pekiştirmeli öğrenme", "Denetimli öğrenme", "Rastgele öğrenme"]
    answer: 3
  - text: "K-means algoritması hangi makine öğrenmesi türüne örnektir?"
    difficulty: 2
    choices: ["Denetimli öğrenme", "Denetimsiz öğrenme", "Pekiştirmeli öğrenme", "Transfer öğrenme"]
    answer: 2
  - text: "Evrişimli sinir ağları (CNN) en çok hangi alanda kullanılır?"
    difficulty: 1
    choices: ["Görüntü işleme", "Veritabanı yedekleme", "Ağ güvenliği duvarları", "Dosya sıkıştırma"]
    answer: 1
  - text: "Yapay sinir ağında nöronlar arasındaki bağlantının gücünü temsil eden değer nedir?"
    difficulty: 2
    choices: ["Epoch", "Batch boyutu", "Öğrenme oranı", "Ağırlık"]
    answer: 4
  - text: "Sinir ağlarında hatayı çıkıştan girişe doğru yayarak ağırlıkları güncelleyen algoritmanın adı nedir?"
    difficulty: 2
    choices: ["Geri yayılım (backpropagation)", "İleri yayılım", "Rastgele arama", "Veri artırma"]
    answer: 1
  - text: "Bir model eğitim verisinde çok başarılı, yeni verilerde başarısızsa bu duruma ne denir?"
    difficulty: 2
    choices: ["Eksik öğrenme", "Normalleştirme", "Aşırı öğrenme (overfitting)", "Çapraz doğrulama"]
    answer: 3
  - text: "Çekişmeli üretici ağları (GAN) ilk kez kim tanıtmıştır?"
    difficulty: 3
    choices: ["Andrew Ng", "Ian Goodfellow", "Geoffrey Hinton", "Yann LeCun"]
    answer: 2
  - text: "AlphaGo 2016'da hangi oyunda dünya çapında bir oyuncuyu yenerek büyük yankı uyandırdı?"
    difficulty: 1
    choices: ["Satranç", "Poker", "Dama", "Go"]
    answer: 4
  - text: "IBM'in Deep Blue bilgisayarı 1997'de hangi satranç şampiyonunu yendi?"
    difficulty: 2
    choices: ["Garry Kasparov", "Magnus Carlsen", "Bobby Fischer", "Anatoly Karpov"]
    answer: 1
  - text: "GPT kısaltmasındaki \"GPT\" neyin açılımıdır?"
    difficulty: 2
    choices: ["General Purpose Technology", "Graphical Processing Tool", "Generative Pre-trained Transformer", "Gradient Pooling Transformer"]
    answer: 3
  - text: "NLP kısaltması Türkçede neyi ifade eder?"
    difficulty: 1
    choices: ["Ağ Katmanı Protokolü", "Doğal Dil İşleme", "Sayısal Lojik Programlama", "Ölçeklenebilir Veri Platformu"]
    answer: 2
  - text: "Pekiştirmeli öğrenmede bir ajanın davranışına karşılık çevreden aldığı geri bildirime ne denir?"
    difficulty: 2
    choices: ["Ödül", "Epoch", "Etiket", "Kernel"]
    answer: 1
  - text: "Aşağıdakilerden hangisi popüler bir derin öğrenme kütüphanesidir?"
    difficulty: 1
    choices: ["jQuery", "Bootstrap", "PyTorch", "Flask"]
    answer: 3
  - text: "Bir sınıflandırma modelinin doğru ve yanlış tahminlerinin dağılımını gösteren tabloya ne ad verilir?"
    difficulty: 3
    choices: ["Gradyan tablosu", "Karmaşıklık matrisi (confusion matrix)", "Aktivasyon haritası", "Karar ağacı"]
    answer: 2
  - text: "Derin öğrenmeye katkılarıyla Geoffrey Hinton ve Yann LeCun ile birlikte 2018 Turing Ödülü'nü kim kazandı?"
    difficulty: 3
    choices: ["Andrew Ng", "Ian Goodfellow", "Demis Hassabis", "Yoshua Bengio"]
    answer: 4
  - text: "Yapay sinir ağlarında bir nöronun çıktısına doğrusal olmayan bir dönüşüm uygulayan fonksiyona ne ad verilir?"
    difficulty: 2
    choices: ["Kayıp fonksiyonu", "Aktivasyon fonksiyonu", "Hash fonksiyonu", "Ölçekleme fonksiyonu"]
    answer: 2
  - text: "Bir yapay sinir ağında veriyi ağa ilk alan katmana ne ad verilir?"
    difficulty: 1
    choices: ["Çıktı katmanı", "Havuzlama katmanı", "Girdi katmanı", "Normalleştirme katmanı"]
    answer: 3
  - text: "Metni, bir dil modelinin işleyebileceği küçük birimlere bölme işlemine ne ad verilir?"
    difficulty: 2
    choices: ["Tokenizasyon", "Normalizasyon", "Kuantizasyon", "Regülarizasyon"]
    answer: 1
  - text: "Kelimeleri anlam ilişkisini koruyan sayısal vektörlere dönüştüren temsile ne ad verilir?"
    difficulty: 2
    choices: ["Sıkıştırma (compression)", "Karma (hashing)", "Dilimleme (slicing)", "Gömme (embedding)"]
    answer: 4
  - text: "Çok sayıda karar ağacının tahminlerini birleştiren topluluk (ensemble) yöntemi hangisidir?"
    difficulty: 2
    choices: ["Destek vektör makinesi", "Rastgele orman", "Doğrusal regresyon", "K-en yakın komşu"]
    answer: 2
  - text: "Model eğitiminde hiç kullanılmayıp nihai başarıyı ölçmek için ayrılan veri kümesine ne ad verilir?"
    difficulty: 1
    choices: ["Eğitim kümesi", "Test kümesi", "Etiket kümesi", "Gürültü kümesi"]
    answer: 2
  - text: "Bir modelin tüm eğitim verisini bir kez baştan sona işlemesine ne ad verilir?"
    difficulty: 1
    choices: ["Kernel", "Bias", "Batch", "Epoch"]
    answer: 4
  - text: "Öğrenme oranı (learning rate) neyi belirler?"
    difficulty: 2
    choices: ["Güncelleme adımının büyüklüğünü", "Eğitimde kullanılan örneklerin sayısını", "Ağdaki gizli katmanların sayısını", "Modelin ayırt edeceği sınıfların sayısını"]
    answer: 1
  - text: "Bir görüntüdeki nesneleri hem sınıflandırıp hem de bir kutuyla konumlandıran göreve ne ad verilir?"
    difficulty: 2
    choices: ["Metin özetleme", "Ses ayrıştırma", "Nesne algılama", "Veri madenciliği"]
    answer: 3
  - text: "Büyük dil modellerinde 'halüsinasyon' ne anlama gelir?"
    difficulty: 3
    choices: ["Eğitim verisini kelimesi kelimesine ezberlemek", "Girdi metnini başka bir dile otomatik çevirmek", "Soruya cevap vermeyi tamamen reddetmek", "Gerçeğe dayanmayan bilgiyi inandırıcı sunmak"]
    answer: 4
  - text: "Takviyeli öğrenmede ajanın içinde hareket ettiği ve ödül aldığı dünyaya ne ad verilir?"
    difficulty: 2
    choices: ["Katman (layer)", "Ortam (environment)", "Gradyan (gradient)", "Çekirdek (kernel)"]
    answer: 2
  - text: "Aşağıdakilerden hangisi Transformer mimarisine dayanan bir dil modelidir?"
    difficulty: 1
    choices: ["Redis", "Nginx", "BERT", "MySQL"]
    answer: 3
  - text: "Örnekleri önceden verilmiş etiketler olmadan benzerliklerine göre gruplara ayırma işine ne ad verilir?"
    difficulty: 2
    choices: ["Kümeleme (clustering)", "Regresyon (regression)", "Sınıflandırma (classification)", "Özetleme (summarization)"]
    answer: 1
  - text: "Bir modelin tahmini ile gerçek değer arasındaki farkı sayısallaştıran fonksiyona ne ad verilir?"
    difficulty: 2
    choices: ["Kayıp (loss) fonksiyonu", "Karma (hash) fonksiyonu", "Ölçekleme fonksiyonu", "Sıralama fonksiyonu"]
    answer: 1
  - text: "Gradyan inişi (gradient descent) algoritması neyi amaçlar?"
    difficulty: 3
    choices: ["Eğitim veri kümesini otomatik olarak büyütmeyi", "Ağdaki katman sayısını sürekli artırmayı", "Kayıp fonksiyonunun değerini en aza indirmeyi", "Çıktıları etiketlerden bağımsız hâle getirmeyi"]
    answer: 3
  - text: "Fotoğraftaki yüzleri tanıma ve doğrulama gibi görevler yapay zekânın hangi alt alanına girer?"
    difficulty: 1
    choices: ["Doğal dil işleme", "Bilgisayarlı görü", "Robotik kinematik", "Veri depolama"]
    answer: 2
  - text: "Alan Turing 1950 tarihli makalesinde hangi soruyu ele alır?"
    difficulty: 2
    choices: ["Bilgisayarlar uyuyabilir mi?", "Yazılım sonsuza dek çalışır mı?", "Zekâ ölçülebilir mi?", "Makineler düşünebilir mi?"]
    answer: 4
  - text: "Makine öğrenmesinde 'özellik' (feature) neyi ifade eder?"
    difficulty: 2
    choices: ["Modelin eğitim süresini gösteren sayaç", "Örneği tanımlayan ölçülebilir nitelik", "Katmanlar arasındaki bağlantı sayısı", "Eğitim sonunda üretilen hata raporu"]
    answer: 2
  - text: "Aşağıdakilerden hangisi denetimli öğrenme görevine örnektir?"
    difficulty: 1
    choices: ["Spam e-postaları ayırt etmeyi öğrenmek", "Müşterileri etiketsiz biçimde gruplamak", "Bir robotu ödül sistemiyle yürütmek", "Etiketsiz görsellerden yeni görsel üretmek"]
    answer: 1
  - text: "Bir modelin eğitimde görmediği yeni verilerde de iyi sonuç vermesine ne ad verilir?"
    difficulty: 3
    choices: ["Ezberleme (memorization)", "Sönümleme (damping effect)", "Ölçekleme (feature scaling)", "Genelleme (generalization)"]
    answer: 4
  - text: "RLHF kısaltmasındaki 'HF' neyi ifade eder?"
    difficulty: 2
    choices: ["High Frequency", "Hidden Features", "Human Feedback", "Hard Fork"]
    answer: 3

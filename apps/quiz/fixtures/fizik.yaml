  - text: "\"Enerji yoktan var edilemez, vardan yok edilemez; yalnızca bir biçimden diğerine dönüşür\" ifadesi hangi ilkeyi anlatır?"
    difficulty: 2
    choices: ["Momentumun korunumu", "Enerjinin korunumu", "Arşimet ilkesi", "Pascal ilkesi"]

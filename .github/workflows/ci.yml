name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: rapidquiz
          POSTGRES_USER: rapidquiz
          POSTGRES_PASSWORD: rapidquiz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rapidquiz -d rapidquiz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://rapidquiz:rapidquiz@localhost:5432/rapidquiz
      # Testler SQLite'a düşerse PostgreSQL'e özgü testler atlanmak yerine hata verir.
      REQUIRE_POSTGRES: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Bağımlılıkları kur
        run: pip install -r requirements/dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Migration'lar güncel mi?
        run: python manage.py makemigrations --check --dry-run

      - name: Test (PostgreSQL 18)
        run: pytest -rs --cov-fail-under=80

  docker:
    name: Production imajı derlenir (python:3.14-slim)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: rapidquiz
          POSTGRES_USER: rapidquiz
          POSTGRES_PASSWORD: rapidquiz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rapidquiz -d rapidquiz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Konteyner host ağını kullanır, böylece servis konteynerine localhost:5432 ile erişir.
      CONTAINER_ENV: >-
        -e DJANGO_SECRET_KEY=ci-only-secret
        -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
        -e DATABASE_URL=postgres://rapidquiz:rapidquiz@localhost:5432/rapidquiz
        -e PORT=8080

    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t rapid-quiz-backend:ci .

      - name: Imaj root olmayan kullanıcıyla çalışıyor mu?
        run: |
          uid=$(docker run --rm rapid-quiz-backend:ci id -u)
          echo "uid=$uid"
          test "$uid" != "0"

      - name: Veritabanı hazırlık betiği (migrate + createcachetable)
        run: docker run --rm --network host $CONTAINER_ENV rapid-quiz-backend:ci sh scripts/predeploy.sh

      - name: Duman testi - Render başlangıç komutu (start.sh) PORT=8080 ile ayağa kalkar
        run: |
          docker run -d --name api --network host $CONTAINER_ENV rapid-quiz-backend:ci sh scripts/start.sh
          status=000
          for i in $(seq 1 30); do
            status=$(curl -s -o health.json -w '%{http_code}' http://localhost:8080/api/v1/health/ || true)
            [ "$status" = "200" ] && break
            sleep 1
          done
          echo "health status: $status"; cat health.json || true
          if [ "$status" != "200" ]; then docker logs api; exit 1; fi
          grep -q '"status": "ok"' health.json

      - name: Duman testi - API uç noktaları ve throttle tablosu
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/categories/)
          test "$code" = "200"
          # Throttle'lı uç nokta DatabaseCache tablosuna dokunur; tablo yoksa 500 döner.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"category":"yok"}' \
            http://localhost:8080/api/v1/quiz-sessions/)
          echo "quiz-sessions status: $code"
          test "$code" = "400"

      - name: Konteyner logları (hata ayıklama için)
        if: always()
        run: docker logs api || true
